name: IL2CPPLens

options:
  bundleIdPrefix: com.il2cpplens
  # The GitHub runner currently uses Xcode 15.4. Keep the generated
  # project readable by Xcode 15 instead of XcodeGen's newer default.
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.20"

targets:
  IL2CPPLens:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.il2cpplens.app
        PRODUCT_NAME: IL2CPPLens
        WRAPPER_EXTENSION: app
        SKIP_INSTALL: "NO"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      gatherCoverageData: false
